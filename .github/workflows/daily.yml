name: Daily Econ Brief

# GitHub의 schedule 이벤트는 공용 큐를 타는데 2026-10-06부터 매일 3~4시간씩
# 밀려 10~11시에 도착했다. cron 분을 옮겨도 소용이 없었다.
# workflow_dispatch는 6회 모두 대기 0초에 시작하므로, 외부 크론
# (cron-job.org, 월~금 07:08 KST)이 dispatch API를 호출하는 방식으로 바꿨다.
# 여기에 schedule을 남겨두면 하루 두 번 발송되므로 제거했다.
on:
  workflow_dispatch:

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python brief.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}